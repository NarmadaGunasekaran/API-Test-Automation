name: Pull Request API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: Deterministic tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run deterministic tests
        run: npm run test:deterministic
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/deterministic-junit.xml

      - name: Upload deterministic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  live-github-test:
    name: Live GitHub test
    needs: deterministic-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live GitHub test
        run: npm run test:live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/live-junit.xml

      - name: Upload live test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
